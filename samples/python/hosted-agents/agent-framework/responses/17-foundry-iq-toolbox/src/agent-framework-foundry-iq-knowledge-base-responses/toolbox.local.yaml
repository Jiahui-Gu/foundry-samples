# Defines the local-development toolbox. Local processes have no hosted-agent
# identity IDs, so this toolbox reaches the same knowledge base through the
# signed-in user's Entra token.
description: Foundry IQ knowledge base for local development
tools:
  - type: mcp
    name: knowledge_base
    server_label: knowledge_base
    server_url: ${KB_MCP_ENDPOINT}
    project_connection_id: knowledge-base-mcp-local
    require_approval: never
