# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: harness-agent-diagnostics
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  harness-agent-diagnostics:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Harness
        - Diagnostics
        - Responses Protocol
        - OpenTelemetry
        - Agent Framework
    project: src/harness-agent-diagnostics
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: harness-agent-diagnostics.dll
    uses:
      - ai-project
    kind: hosted
    name: harness-agent-diagnostics
    displayName: Harness Agent Diagnostics
    description: HarnessAgent diagnostic sample for validating hosted Responses and OpenTelemetry wiring.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
